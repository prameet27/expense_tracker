<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %} Expense Tracker {% endblock %}</title>
        <style>
            *{
                box-sizing: border-box;
            }
            body
            {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background: #f4f5f7;
                display: flex;
                min-height: 100vh;
            }
            .sidebar{
                width: 220px;
                flex-shrink: 0;
                background: #2c3e50;
                color: #ecf0f1;
                padding: 20px 0;
            }

            .sidebar h2{
                padding: 0 20px 16px 20px;
                margin: 0 0 8px 0;
                font-size: 19px;
                border-bottom: 1px solid #3d566e;
            }
            
            .sidebar .user-info{
                padding: 0 20px 16px 20px;
                margin-bottom: 8px;
                font-size: 13px;
                color: #bdc3c7;
                border-bottom: 1px solid #3d566e;
            }

            .sidebar .user-info strong{
                color: #ecf0f1;
            }
            
            .sidebar a, .sidebar form button{
                display: block;
                width: 100%;
                text-align: left;
                color: #ecf0f1;
                text-decoration: none;
                background: none;
                border: none;
                font-size: 14px;
                font-family: inherit;
                padding: 12px 20px;
                cursor: pointer;
            }

            .sidebar a:hover, .sidebar form button:hover{
                background: #34495e;
            }

            .sidebar a.active{
                background: #1abc9c;
                font-weight: bold;
            }

            .sidebar .signout{
                margin-top: 16px;
                border-top: 1px solid #3d566e;
                padding-top: 8px;
            }

            .main{
                flex: 1;
                padding: 28px 36px;
            }

            table{
                border-collapse: collapse;
                margin: 12px 0 24px 0;
                width: 100%;
                max-width: 900px;
                background: #fff;
            }

            th, td{
                border: 1px solid #ddd;
                padding: 8px 10px;
                text-align: left;
            }
            th{
                background: #ecf0f1;
            }
            .filter-form select, .filter-form input, .filter-form button{
                padding: 6px 8px;
                margin-right: 8px;
            }
            .cal-nav{
                display: flex;
                align-items: center;
                gap: 18px;
                margin-bottom: 4px;
            }
            .cal-nav h2{
                margin: 0;
                font-size: 20px;
            }

            .cal-nav a{
                text-decoration: none;
            }

            .cal-month-total{
                margin: 6px 0 14px 0;
            }

            table.calendar-table{
                border-collapse: collapse;
                width: 100%;
                max-width: 980px;
                table-layout: fixed;
            }

            table.calendar-table th{
                background: #2c3e50;
                color: #ecf0f1;
                padding: 8px;
                text-align: center;
            }

            table.calendar-table td.cal-day{
                border: 1px solid #ddd;
                vertical-align: top;
                height: 100px;
                width: 14.28%;
                padding: 6px;
                font-size: 12px;
                background: #fff;
            }

            table.calendar-table td.cal-day.empty{
                background: #f4f5f7;
            }

            table.calendar-table td.cal-day.today{
                background: #eafaf1;
                border: 2px solid #1abc9c;
            }

            .day-num{
                font-weight: bold;
                margin-bottom: 4px;
            }

            .day-total{
                color: #c0392b;
                font-weight: bold;
                margin-bottom: 2px;
            }
            .day-item{
                font-size: 11px;
                color: #555;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        </style>
    </head>
    <body>
        {% if user.is_authenticated %}
        <div class="sidebar">
            <h2> Expense Tracker </h2>
            <div class="user-info">
                Logged in as: <strong>{{ user.username }}</strong>
            </div>
            <a href="{% url 'expense_list' %}" class="{% if request.resolver_match.url_name == 'expense_list' %} active {% endif %}">My Expenses</a>
            <a href="{% url 'add_expense' %}" class="{% if request.resolver_match.url_name == 'add_expense' %} active {% endif %}">Add Expense</a>
            <a href="{% url 'expense_calendar' %}" class="{% if request.resolver_match.url_name == 'expense_calendar' %} active {% endif %}">Expense Calendar</a>
            <div class="signout">
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Sign Out</button>
                </form>
            </div>
        </div>
        {% endif %}
        <div class="main">
            {% block content %} {% endblock %}
        </div>
    </body>
</html>
